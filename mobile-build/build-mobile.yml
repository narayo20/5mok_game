name: Build Mobile Packages (Android APK & iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/5mok_game-android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5mok_game-android-apk
          path: output/5mok_game-android.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "5mok_game v1.0.0 (Android APK & Web Package)"
          body: |
            ## 📱 5mok_game 모바일 패키지 릴리즈

            ### 📥 다운로드 링크
            - **안드로이드 앱 (APK):** 아래 Assets의 `5mok_game-android.apk`를 다운로드하여 바로 설치할 수 있습니다.
            - **아이폰 (iOS):** Safari 브라우저에서 실행 후 **[공유 버튼] ➔ [홈 화면에 추가]**를 누르면 풀스크린 모바일 앱으로 즉시 설치됩니다.

            ### 🎮 주요 기능
            - 15x15 국제 공식 렌주룰 (흑 3-3/4-4/장목 금수, 백 무제한 승리)
            - Wi-Fi 및 모바일 핫스팟 기반 초고속 1:1 무선 P2P 대전
            - 1기기 2인 오프라인 대전 및 AI 연습 봇
          files: output/5mok_game-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
